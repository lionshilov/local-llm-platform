[project]
name = "local-llm-platform"
version = "0.1.0"
description = "Run, serve, benchmark, evaluate and build agents on local LLMs — production patterns on a laptop."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [{ name = "Lev Shilov" }]
dependencies = []

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/*", "services/*"]

[tool.uv.sources]
llm-bench = { workspace = true }
llm-gateway = { workspace = true }

[dependency-groups]
dev = [
    "llm-bench",
    "llm-gateway",
    "mypy>=1.13",
    "pre-commit>=4.0",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "types-PyYAML>=6.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "ASYNC", "PT", "C4", "PTH"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
mypy_path = ["packages/llm-bench/src", "services/gateway/src"]

[tool.pytest.ini_options]
addopts = "--import-mode=importlib -ra"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["packages", "services"]
