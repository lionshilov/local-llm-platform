# Unit tests for alerts.yml: synthetic series in, expected alerts out.
#   docker run --rm --entrypoint promtool -v "$PWD/deploy/prometheus:/rules:ro" -w /rules \
#     prom/prometheus:v3.15.1 test rules alerts.test.yml

rule_files:
  - alerts.yml

evaluation_interval: 15s

tests:
  # --- Scrape targets ----------------------------------------------------------------
  - name: gateway and engine down
    interval: 15s
    input_series:
      - series: 'up{job="gateway", instance="gateway:8000", service="llm-gateway"}'
        values: "1 1 0x10"
      - series: 'up{job="llamacpp", instance="host.docker.internal:8080", engine="llamacpp"}'
        values: "1 1 0x10"
    alert_rule_test:
      - eval_time: 1m # down for 30s: still pending
        alertname: LLMGatewayDown
        exp_alerts: []
      - eval_time: 2m
        alertname: LLMGatewayDown
        exp_alerts:
          - exp_labels:
              severity: critical
              slo: availability
              job: gateway
              instance: gateway:8000
              service: llm-gateway
            exp_annotations:
              summary: Gateway gateway:8000 is down
              description: >-
                Prometheus cannot scrape the gateway at gateway:8000. Every client request
                is failing.
              runbook_url: &runbook https://github.com/lionshilov/local-llm-platform/blob/main/deploy/README.md#alerts-and-runbooks
      - eval_time: 2m
        alertname: LLMEngineScrapeDown
        exp_alerts:
          - exp_labels:
              severity: critical
              slo: availability
              job: llamacpp
              instance: host.docker.internal:8080
              engine: llamacpp
            exp_annotations:
              summary: Inference engine host.docker.internal:8080 (llamacpp) is down
              description: >-
                Prometheus cannot scrape llamacpp at host.docker.internal:8080. Requests
                routed to it fail with 502 upstream_unavailable.
              runbook_url: *runbook

  # --- Error ratio ---------------------------------------------------------------------
  # 100 req/min on llamacpp: 80 ok, 10 failed, 5 cancelled by the client, 5 client errors.
  # Only the 10 failures count: 10% error ratio. mlx has traffic and no errors.
  - name: error ratio counts only server-side failures
    interval: 1m
    input_series:
      - series: 'llm_gateway_requests_total{backend="llamacpp", outcome="ok"}'
        values: "0+80x30"
      - series: 'llm_gateway_requests_total{backend="llamacpp", outcome="upstream_error"}'
        values: "0+10x30"
      - series: 'llm_gateway_requests_total{backend="llamacpp", outcome="cancelled"}'
        values: "0+5x30"
      - series: 'llm_gateway_requests_total{backend="llamacpp", outcome="upstream_400"}'
        values: "0+5x30"
      - series: 'llm_gateway_requests_total{backend="mlx", outcome="ok"}'
        values: "0+10x30"
    promql_expr_test:
      - expr: backend:llm_gateway_error_ratio:rate5m
        eval_time: 10m
        exp_samples:
          - labels: 'backend:llm_gateway_error_ratio:rate5m{backend="llamacpp"}'
            value: 0.1
          - labels: 'backend:llm_gateway_error_ratio:rate5m{backend="mlx"}'
            value: 0
    alert_rule_test:
      - eval_time: 4m
        alertname: LLMGatewayHighErrorRatio
        exp_alerts: []
      - eval_time: 10m
        alertname: LLMGatewayHighErrorRatio
        exp_alerts:
          - exp_labels:
              severity: warning
              slo: availability
              backend: llamacpp
            exp_annotations:
              summary: "llamacpp: 10% of requests failing"
              description: >-
                10% of chat requests to backend llamacpp failed over the last 5 minutes
                (threshold 5%, SLO 99% success).
              runbook_url: *runbook
      - eval_time: 10m # 10% < 14.4x burn threshold
        alertname: LLMGatewayErrorBudgetFastBurn
        exp_alerts: []

  # --- Burn rates ----------------------------------------------------------------------
  # 20% errors for 70 minutes, then the errors stop.
  - name: fast burn fires, then resolves as soon as errors stop
    interval: 1m
    input_series:
      - series: 'llm_gateway_requests_total{backend="llamacpp", outcome="ok"}'
        values: "0+80x90"
      - series: 'llm_gateway_requests_total{backend="llamacpp", outcome="upstream_unavailable"}'
        values: "0+20x70 1400x20"
    alert_rule_test:
      - eval_time: 60m
        alertname: LLMGatewayErrorBudgetFastBurn
        exp_alerts:
          - exp_labels:
              severity: critical
              slo: availability
              backend: llamacpp
            exp_annotations:
              summary: "llamacpp: error budget burning 14x too fast"
              description: >-
                20% of requests to llamacpp failed over the last hour, over 14.4x the rate
                the 1% error budget allows. Sustained, that exhausts the 30-day budget in
                under two days.
              runbook_url: *runbook
      - eval_time: 80m # 1h ratio still high, 5m ratio is 0
        alertname: LLMGatewayErrorBudgetFastBurn
        exp_alerts: []

  # 8% errors (HTTP 502 from the engine) for 7 hours.
  - name: slow burn
    interval: 5m
    input_series:
      - series: 'llm_gateway_requests_total{backend="llamacpp", outcome="ok"}'
        values: "0+460x90"
      - series: 'llm_gateway_requests_total{backend="llamacpp", outcome="upstream_502"}'
        values: "0+40x90"
    alert_rule_test:
      - eval_time: 7h
        alertname: LLMGatewayErrorBudgetSlowBurn
        exp_alerts:
          - exp_labels:
              severity: warning
              slo: availability
              backend: llamacpp
            exp_annotations:
              summary: "llamacpp: error budget burning 6x too fast"
              description: >-
                8% of requests to llamacpp failed over the last 6 hours, over 6x the rate
                the 1% error budget allows. Sustained, that exhausts the 30-day budget in
                under five days.
              runbook_url: *runbook

  # --- Latency -------------------------------------------------------------------------
  # llamacpp: 10 req/min, 8 within 1 s, 2 between 2.5 s and 5 s -> p95 = 4.375 s.
  # mlx: everything within 1 s -> p95 = 0.95 s.
  - name: TTFT p95 above SLO
    interval: 1m
    input_series:
      - series: 'llm_gateway_time_to_first_token_seconds_bucket{backend="llamacpp", le="1.0"}'
        values: "0+8x20"
      - series: 'llm_gateway_time_to_first_token_seconds_bucket{backend="llamacpp", le="2.5"}'
        values: "0+8x20"
      - series: 'llm_gateway_time_to_first_token_seconds_bucket{backend="llamacpp", le="5.0"}'
        values: "0+10x20"
      - series: 'llm_gateway_time_to_first_token_seconds_bucket{backend="llamacpp", le="+Inf"}'
        values: "0+10x20"
      - series: 'llm_gateway_time_to_first_token_seconds_bucket{backend="mlx", le="1.0"}'
        values: "0+10x20"
      - series: 'llm_gateway_time_to_first_token_seconds_bucket{backend="mlx", le="2.5"}'
        values: "0+10x20"
      - series: 'llm_gateway_time_to_first_token_seconds_bucket{backend="mlx", le="+Inf"}'
        values: "0+10x20"
    alert_rule_test:
      - eval_time: 8m
        alertname: LLMGatewayTTFTHigh
        exp_alerts: []
      - eval_time: 15m
        alertname: LLMGatewayTTFTHigh
        exp_alerts:
          - exp_labels:
              severity: warning
              slo: latency
              backend: llamacpp
            exp_annotations:
              summary: "llamacpp: TTFT p95 4.375s (SLO 2.5s)"
              description: >-
                95th percentile time to first token for llamacpp has been above the 2.5 s
                SLO for 10 minutes (now 4.375s). Usually prefill queueing: long prompts or
                all engine slots busy.
              runbook_url: *runbook

  # Half the streams at <= 100 ms per token, half between 100 and 250 ms -> p95 = 235 ms.
  - name: TPOT p95 above SLO
    interval: 1m
    input_series:
      - series: 'llm_gateway_time_per_output_token_seconds_bucket{backend="llamacpp", le="0.1"}'
        values: "0+5x20"
      - series: 'llm_gateway_time_per_output_token_seconds_bucket{backend="llamacpp", le="0.25"}'
        values: "0+10x20"
      - series: 'llm_gateway_time_per_output_token_seconds_bucket{backend="llamacpp", le="+Inf"}'
        values: "0+10x20"
    alert_rule_test:
      - eval_time: 15m
        alertname: LLMGatewayTPOTHigh
        exp_alerts:
          - exp_labels:
              severity: warning
              slo: latency
              backend: llamacpp
            exp_annotations:
              summary: "llamacpp: TPOT p95 235ms (SLO 100ms)"
              description: >-
                The slowest 5% of streams on llamacpp generate fewer than 10 tokens/s per
                user (TPOT p95 235ms). The decode batch is too large for the hardware, or
                the GPU is shared with something else.
              runbook_url: *runbook

  # --- Saturation ----------------------------------------------------------------------
  - name: sustained queueing in llama.cpp alerts, a short spike does not
    interval: 15s
    input_series:
      - series: 'llamacpp:requests_deferred{job="llamacpp", instance="host.docker.internal:8080"}'
        values: "0 0 2x40"
      - series: 'llamacpp:requests_deferred{job="llamacpp", instance="spiky:8080"}'
        values: "0 3 0x40"
    alert_rule_test:
      - eval_time: 3m
        alertname: LlamaCppRequestsQueueing
        exp_alerts: []
      - eval_time: 7m
        alertname: LlamaCppRequestsQueueing
        exp_alerts:
          - exp_labels:
              severity: warning
              slo: latency
              job: llamacpp
              instance: host.docker.internal:8080
            exp_annotations:
              summary: llama.cpp at host.docker.internal:8080 is queueing requests
              description: >-
                All decode slots on host.docker.internal:8080 have been busy for 5 minutes
                and up to 2 request(s) wait for a free slot. Their TTFT grows with every
                queued request. Add slots (--parallel) or replicas, or shed load at the
                gateway.
              runbook_url: *runbook

  # llamacpp: one stream open, no request completes. mlx: one stream open, requests
  # keep completing (normal busy backend).
  - name: in-flight requests with no completions
    interval: 1m
    input_series:
      - series: 'llm_gateway_in_flight_requests{backend="llamacpp"}'
        values: "1x40"
      - series: 'llm_gateway_requests_total{backend="llamacpp", outcome="ok"}'
        values: "5x40"
      - series: 'llm_gateway_in_flight_requests{backend="mlx"}'
        values: "1x40"
      - series: 'llm_gateway_requests_total{backend="mlx", outcome="ok"}'
        values: "0+1x40"
    alert_rule_test:
      - eval_time: 20m
        alertname: LLMGatewayRequestsStuck
        exp_alerts:
          - exp_labels:
              severity: warning
              slo: availability
              backend: llamacpp
            exp_annotations:
              summary: "llamacpp: 1 request(s) in flight, none completed in 15m"
              description: >-
                1 streaming request(s) to llamacpp are in flight but no request has
                completed for 15 minutes. The engine is hung or a stream never closed.
              runbook_url: *runbook
