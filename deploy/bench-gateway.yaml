# Light, short load through the containerized gateway (deploy/compose.yaml), to see the
# dashboard and alert rules react to real traffic:
#
#   uv run llm-bench run -c deploy/bench-gateway.yaml --requests 4 --output-dir /tmp/bench
#
# The gateway translates reasoning_effort into each engine's own thinking switch.

engines:
  gateway-llamacpp:
    label: llama.cpp via containerized gateway
    base_url: http://127.0.0.1:8100/v1
    model: llamacpp
    extra_body:
      reasoning_effort: none

scenarios:
  chat:
    description: Short prompt, short answer, at 1 and 2 concurrent users.
    prompt_words: 40
    max_tokens: 96
    concurrency: [1, 2]
    requests_per_level: 4
