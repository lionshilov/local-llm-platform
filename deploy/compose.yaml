# Gateway + Prometheus + Grafana in containers. Inference engines run natively on the
# host (Docker on macOS has no GPU) and are reached via host.docker.internal.
#
#   docker compose -f deploy/compose.yaml up -d --build --wait
#
#   Chat UI + OpenAI API   http://127.0.0.1:8100        (/v1, /metrics, /healthz)
#   Prometheus             http://127.0.0.1:9090
#   Grafana                http://127.0.0.1:3300
#
# Ports are bound to 127.0.0.1: nothing here has auth, so it is not exposed to the LAN.

name: local-llm

x-defaults: &defaults
  restart: unless-stopped
  security_opt: ["no-new-privileges:true"]
  cap_drop: [ALL]
  logging:
    driver: json-file
    options: { max-size: 10m, max-file: "3" }

services:
  gateway:
    <<: *defaults
    build:
      context: ..
      dockerfile: deploy/gateway.Dockerfile
    image: local-llm/gateway:dev
    init: true
    ports:
      - "127.0.0.1:8100:8000"   # host 8000 is left free for a native `make gateway`
    volumes:
      - ./gateway.docker.yaml:/config/gateway.yaml:ro
    extra_hosts:
      - host.docker.internal:host-gateway   # Docker Desktop resolves it anyway; Linux needs this
    read_only: true
    tmpfs: [/tmp]
    stop_grace_period: 30s                  # let open streams finish
    # healthcheck: built into the image (GET /healthz)
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 256M }

  prometheus:
    <<: *defaults
    image: prom/prometheus:v3.15.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --storage.tsdb.retention.size=2GB
      - --web.enable-lifecycle             # curl -X POST localhost:9090/-/reload after edits
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./prometheus:/etc/prometheus:ro
      - prometheus-data:/prometheus
    extra_hosts:
      - host.docker.internal:host-gateway
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9090/-/ready"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 30s
      start_interval: 2s
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 512M }

  grafana:
    <<: *defaults
    image: grafana/grafana:13.3.0
    depends_on:
      prometheus:
        condition: service_healthy
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_AUTH_ANONYMOUS_ENABLED: "true"     # local use: dashboards open without login
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: http://localhost:3300/
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/dashboards/llm-gateway.json
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
    ports:
      - "127.0.0.1:3300:3000"   # not 3000: usually taken by a dev server
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 60s
      start_interval: 2s
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 512M }

volumes:
  prometheus-data:
  grafana-data:
