apiVersion: 1

providers:
  - name: local-llm
    folder: Local LLM
    type: file
    disableDeletion: true
    allowUiUpdates: false    # dashboards are code: edit the JSON in deploy/grafana/dashboards
    updateIntervalSeconds: 30
    options:
      path: /etc/grafana/dashboards
      foldersFromFilesStructure: false
