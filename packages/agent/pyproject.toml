[project]
name = "llm-agent"
version = "0.1.0"
description = "Tool-calling agent harness for local LLMs, built from scratch."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [{ name = "Lev Shilov" }]
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "rich>=13.7",
    "typer>=0.12",
]

[project.scripts]
llm-agent = "llm_agent.cli:app"

[build-system]
requires = ["uv_build>=0.11.0,<0.14"]
build-backend = "uv_build"
