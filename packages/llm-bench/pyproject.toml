[project]
name = "llm-bench"
version = "0.1.0"
description = "Benchmark OpenAI-compatible LLM servers: TTFT, TPOT, inter-token latency and throughput under concurrency."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [{ name = "Lev Shilov" }]
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "rich>=13.7",
    "typer>=0.12",
]

[project.scripts]
llm-bench = "llm_bench.cli:app"

[build-system]
requires = ["uv_build>=0.11.0,<0.12"]
build-backend = "uv_build"
