[project]
name = "llm-evals"
version = "0.1.0"
description = "Evaluation harness for local LLMs: quality vs speed across engines and quantizations."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [{ name = "Lev Shilov" }]
dependencies = [
    "httpx>=0.27",
    "jsonschema>=4.23",
    "llm-bench",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "rich>=13.7",
    "typer>=0.12",
]

[project.scripts]
llm-evals = "llm_evals.cli:app"

[build-system]
requires = ["uv_build>=0.11.0,<0.14"]
build-backend = "uv_build"
