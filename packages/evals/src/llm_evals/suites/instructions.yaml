      - {type: markdown_table, rows: 5, columns: 2}
      - {type: lowercase}
    reference: |-
      | item | why |
      |---|---|
      | tent | shelter for two nights |
      | sleeping bag | warmth at night |
      | headlamp | light after sunset |
      | water filter | safe drinking water |
      | first aid kit | small injuries |

  - id: if-28
    task: Explain the rules of tic-tac-toe.
    instructions:
      - {type: min_words, n: 60}
      - {type: keyword_count, keyword: grid, at_least: 2}
      - {type: no_commas}
    reference: >-
      Tic-tac-toe is played by two players on a grid of three rows and three columns. One
      player uses X and the other uses O. They take turns placing their mark in an empty
      square of the grid. The first player to get three marks in a row wins. The row can be
      horizontal or vertical or diagonal. If all nine squares are filled and nobody has
      three in a row the game is a draw.

