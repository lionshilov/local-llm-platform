# Original verifiable-instruction items in the spirit of IFEval (no prompts copied).
# The prompt is `task` followed by each instruction's own sentence (see
# scoring/instructions.py), so the text asked for and the code that checks it cannot drift.
# `reference` is a response that passes every check; the test suite verifies this, which
# guarantees no item combines contradictory instructions.

name: instructions
kind: instructions
description: Verifiable formatting and content constraints, checked in code.

items:
  - id: if-01
    task: Give some tips for staying focused while working from home.
    instructions:
      - {type: bullet_points, n: 4}
      - {type: lowercase}
    reference: |-
      - keep a fixed start time every morning
      - work from a desk that is only used for work
      - silence notifications during deep work
      - take a short walk at lunch

  - id: if-02
    task: Explain what a hash table is.
    instructions:
      - {type: max_words, n: 50}
      - {type: no_commas}
      - {type: quoted}
    reference: |-
      "A hash table stores key and value pairs. It runs each key through a hash function to
      pick a slot in an array so lookups take constant time on average. Collisions are
      handled with chaining or open addressing."

  - id: if-03
    task: Compare Python, JavaScript and Go as first programming languages.
    instructions:
      - {type: markdown_table, rows: 3, columns: 3}
      - {type: postscript, marker: P.S.}
    reference: |-
      | Language | Strength | Weakness |
      |---|---|---|
      | Python | Readable syntax | Slower runtime |
      | JavaScript | Runs in every browser | Quirky type coercion |
      | Go | Simple concurrency | Fewer beginner tutorials |

      P.S. Any of them is a fine first choice.

  - id: if-04
    task: Write a short motivational message for a team the night before a product launch.
    instructions:
      - {type: keyword_count, keyword: together, at_least: 2}
      - {type: ends_with, phrase: "Let's ship it!"}
    reference: >-
      We built this together, and tomorrow we launch it together. Get some rest tonight.
      Let's ship it!

  - id: if-05
    task: Describe the water cycle.
    instructions:
      - {type: paragraphs, n: 3}
      - {type: forbidden_words, words: [rain]}
    reference: |-
      The sun heats oceans and lakes, and water evaporates into the air as vapor.

      As the vapor rises it cools and condenses into tiny droplets that form clouds.

      When the droplets grow heavy they fall back to the ground as precipitation, flow into
      rivers and seas, and the cycle begins again.

  - id: if-06
    task: Write a product announcement for a new coffee grinder.
    instructions:
      - {type: title}
      - {type: placeholders, at_least: 2}
      - {type: max_words, n: 120}
    reference: |-
      <<Meet the Grindmaster One>>

      Our new burr grinder gives you a consistent grind for espresso or pour-over. It
      launches on [launch date] at a price of [price]. Pre-order today.

  - id: if-07
    task: Explain why the sky is blue to a ten-year-old.
    instructions:
      - {type: uppercase}
      - {type: max_words, n: 60}
    reference: >-
      SUNLIGHT IS MADE OF MANY COLORS. WHEN IT HITS THE AIR, THE BLUE LIGHT BOUNCES AROUND
      THE MOST, SO BLUE COMES AT YOU FROM EVERY PART OF THE SKY.

  - id: if-08
    task: List the planets of the solar system in order from the Sun.
    instructions:
      - {type: numbered_list, n: 8}
      - {type: no_commas}
    reference: |-
      1. Mercury
      2. Venus
      3. Earth
      4. Mars
      5. Jupiter
      6. Saturn
      7. Uranus
      8. Neptune

  - id: if-09
    task: Write a short email to a landlord asking them to fix a leaking kitchen tap.
    instructions:
      - {type: starts_with, phrase: Dear landlord}
      - {type: postscript, marker: P.S.}
    reference: |-
      Dear landlord,

      The kitchen tap in my flat has been leaking for a week. Could you arrange a repair?

      Kind regards,
      Alex

      P.S. I am home every evening after 6 pm.

  - id: if-10
    task: Summarize the benefits of regular exercise.
    instructions:
      - {type: sections, n: 3}
      - {type: min_words, n: 60}
    reference: |-
      SECTION 1
      Regular exercise strengthens the heart and lungs, lowers blood pressure and helps keep
      a healthy weight.

      SECTION 2
      It also improves mood, reduces stress and anxiety, and helps people sleep more deeply.

      SECTION 3
      Over the long term, staying active lowers the risk of diabetes, some cancers and the
      age-related loss of muscle and bone, which keeps people independent for longer.

  - id: if-11
    task: Suggest a quick vegetarian dinner.
    instructions:
      - {type: highlights, at_least: 2}
      - {type: ends_with, phrase: Enjoy your meal!}
    reference: >-
      Try a *chickpea curry*: fry onion and garlic, add curry paste, chickpeas and a tin of
      tomatoes, and simmer for 15 minutes. Serve it with *warm naan*. Enjoy your meal!

  - id: if-12
    task: Describe your ideal weekend.
    instructions:
      - {type: quoted}
      - {type: no_commas}
    reference: >-
      "Sleeping in on Saturday and then a long walk in the hills followed by a slow dinner
      with friends. On Sunday a good book and an early night."

  - id: if-13
    task: Explain what an API is.
    instructions:
      - {type: keyword_count, keyword: interface, at_least: 2}
      - {type: max_words, n: 80}
      - {type: lowercase}
    reference: >-
      an api is an interface that lets one program ask another program for data or actions.
      the interface defines which requests are allowed and what the answers look like, so
      both sides can change their internals without breaking each other.

  - id: if-14
    task: Suggest names for a new neighborhood bakery.
    instructions:
      - {type: bullet_points, n: 5}
      - {type: forbidden_words, words: [bread, cake]}
    reference: |-
      - The Rising Crumb
      - Flour & Ember
      - Morning Crust
      - Sweet Corner
      - Golden Oven

  - id: if-15
    task: Give instructions for brewing a cup of green tea.
    instructions:
      - {type: numbered_list, n: 5}
      - {type: ends_with, phrase: Enjoy your tea.}
    reference: |-
      1. Heat water to about 80 °C.
      2. Put one teaspoon of leaves in a cup or pot.
      3. Pour the water over the leaves.
      4. Steep for two to three minutes.
      5. Strain and serve.

      Enjoy your tea.

  - id: if-16
    task: Compare trains and planes for a 500 km trip.
    instructions:
      - {type: markdown_table, rows: 4, columns: 3}
      - {type: title}
    reference: |-
      <<Train vs plane for 500 km>>

      | Factor | Train | Plane |
      |---|---|---|
      | Door-to-door time | About 3.5 hours | About 3.5 hours |
      | Cost | Moderate | Varies widely |
      | Comfort | Spacious seats | Cramped seats |
      | Emissions | Low | High |

  - id: if-17
    task: Write a short poem about the ocean.
    instructions:
      - {type: lowercase}
      - {type: no_commas}
      - {type: max_words, n: 30}
    reference: |-
      grey waves fold and break
      salt on the cold morning wind
      the tide keeps its time

  - id: if-18
    task: Explain the difference between RAM and storage.
    instructions:
      - {type: paragraphs, n: 2}
      - {type: starts_with, phrase: In short}
    reference: |-
      In short, RAM is fast temporary memory and storage is slower permanent memory.

      RAM holds the programs and data the computer is using right now and is cleared when
      the power goes off. Storage, such as an SSD, keeps files even when the computer is off.

  - id: if-19
    task: Write a short bio for a fictional chef.
    instructions:
      - {type: placeholders, at_least: 3}
      - {type: min_words, n: 50}
    reference: >-
      [Chef name] grew up in [hometown], where she learned to cook in her grandmother's
      kitchen. After training in Lyon, she opened [restaurant name], a small bistro known for
      seasonal vegetables and slow-cooked stews. She believes good food starts with good
      farmers and spends her mornings at the market choosing what to cook that night.

  - id: if-20
    task: Give advice for a first job interview.
    instructions:
      - {type: sections, n: 2}
      - {type: highlights, at_least: 3}
    reference: |-
      SECTION 1
      Before the interview, *research the company* and *prepare short stories* about your
      past work.

      SECTION 2
      During the interview, listen carefully, answer with examples and
      *ask a thoughtful question* at the end.

  - id: if-21
    task: Describe a sunset at the beach.
    instructions:
      - {type: uppercase}
      - {type: no_commas}
    reference: >-
      THE SUN SINKS INTO THE SEA AND PAINTS THE WATER ORANGE AND PINK. THE WAVES GROW QUIET
      AND THE SAND COOLS UNDER YOUR FEET.

  - id: if-22
    task: Explain how to restart a home Wi-Fi router.
    instructions:
      - {type: numbered_list, n: 4}
      - {type: postscript, marker: P.S.}
    reference: |-
      1. Unplug the router from the power socket.
      2. Wait about 30 seconds.
      3. Plug it back in.
      4. Wait until the lights are steady, then reconnect.

      P.S. If the problem keeps coming back, contact your internet provider.

  - id: if-23
    task: Write a social media post announcing a library's new opening hours.
    instructions:
