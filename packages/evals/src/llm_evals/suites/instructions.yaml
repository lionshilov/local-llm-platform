      Come study, borrow or just relax at your library. #ReadMore

  - id: if-24
    task: Explain what machine learning is.
    instructions:
      - {type: quoted}
      - {type: max_words, n: 50}
    reference: >-
      "Machine learning is a way of building software that learns patterns from examples
      instead of following hand-written rules. Given enough data, it can make predictions
      about new cases."

  - id: if-25
    task: Describe three hobbies that help people relax.
    instructions:
