      - {type: highlights, at_least: 3}
    reference: |-
      - *Gardening* gets you outside and keeps your hands busy.
      - *Reading* lets you step into another world.
      - *Yoga* slows your breathing and loosens tight muscles.

  - id: if-26
    task: Write the opening of a short story about a lighthouse keeper.
    instructions:
      - {type: title}
      - {type: forbidden_words, words: [storm, dark]}
    reference: |-
      <<The Last Keeper>>

      Every evening at six, Mara climbed the hundred and twelve steps to light the lamp. The
      ships had stopped coming years ago, but she climbed anyway.

  - id: if-27
    task: Write a packing list for a weekend camping trip.
