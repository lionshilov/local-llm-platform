# Backends the gateway exposes. Clients pick one with `"model": "<name>"`.
# Start whichever engines you want (`make serve-llamacpp`, ...); the UI shows which are up.

default_backend: llamacpp

backends:
  llamacpp:
    label: Qwen3.5 4B · llama.cpp
    engine: llamacpp
    base_url: http://127.0.0.1:8080/v1
    model: qwen3.5-4b

  mlx:
    label: Qwen3.5 4B · MLX-LM
    engine: mlx
    base_url: http://127.0.0.1:8081/v1
    model: mlx-community/Qwen3.5-4B-MLX-4bit

  ollama-gguf:
    label: Qwen3.5 4B · Ollama GGUF
    engine: ollama
    base_url: http://127.0.0.1:11434/v1
    model: qwen3.5:4b-q4_K_M

  ollama-mlx:
    label: Qwen3.5 4B · Ollama MLX
    engine: ollama
    base_url: http://127.0.0.1:11434/v1
    model: qwen3.5:4b-nvfp4
