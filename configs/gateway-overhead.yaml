# What does the gateway cost? The same llama.cpp server, hit directly and through the
# gateway, in one run. Start both first: `make serve-llamacpp` and `make gateway`.
#
#   uv run llm-bench run -c configs/gateway-overhead.yaml --tag gateway-overhead

engines:
  direct:
    label: llama.cpp direct
    base_url: http://127.0.0.1:8080/v1
    model: qwen3.5-4b
    extra_body:
      chat_template_kwargs: {enable_thinking: false}

  gateway:
    label: llama.cpp via gateway
    base_url: http://127.0.0.1:8000/v1
    model: llamacpp
    extra_body:
      reasoning_effort: none

scenarios:
  short:
    description: Short prompt and answer, many requests, so TTFT differences are visible.
    prompt_words: 40
    max_tokens: 64
    concurrency: [1, 4]
    requests_per_level: 16
