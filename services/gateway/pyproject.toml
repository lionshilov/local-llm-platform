[project]
name = "llm-gateway"
version = "0.1.0"
description = "OpenAI-compatible gateway for local LLM engines: routing, quirk normalization, Prometheus metrics, chat UI."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [{ name = "Lev Shilov" }]
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.27",
    "prometheus-client>=0.21",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "uvicorn[standard]>=0.32",
]

[project.scripts]
llm-gateway = "llm_gateway.__main__:main"

[build-system]
requires = ["uv_build>=0.11.0,<0.14"]
build-backend = "uv_build"
